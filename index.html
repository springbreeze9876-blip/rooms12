const SEC={"s": "v3Nk0sQ8kZZoGMJVzrkmgA==", "i": "r2M08dyAYXdvdhVd", "c": "a+pV2e+40aXcin9+3KqiVjAvfJ1CKj8VQItXNk7/d6Yov4sRaopKz2NRiAKtJCTQAkxsQYJw81Ic7z9gwlFbILETtmGbMa5jU1mp3r+dvoXsMezsLX5ijTt5N8/5gGqMHp85K0PR3bL4uUS74ZDamvnCQW7SA8BVQpmWPhw8O3+2A9WldvmN4Xg8fY4apwXAVQ3reDgUnJBdeYYWnYgk2DVBqjgY404Ceq7kc7n6gnYWAjVEG6yb0HJErSKiR/nXg6yrrnF6Dyr8xeY3h0Jj4VtcMm07J30LmTOiEwXM5WQCc+uq6gMsmRNO9GNa+UtWFP9A7GXuDoGVCiuFX3cc7HZS2QD0LPAtKK1Bg0I0Pg9+y+JNGzjO4rzEOorn8Iaxh+3wf92TmSHzcFihG9KiAdnYqV/BJLindBr8z3ChWCjEXsrfdrOBtvzjEgbz4W2EImf4Cs0Thd3mqDLCN3qqIjUtd1j5zR2qfRtynj19Qe4yBmbEDwbzaxOpJpw0XDAG/X+37lHInuyUTbuDkzQEmgr1C/2r17t2WClZ5Afx1dv3IYpYv/oEBIsJhfidKZDZ7olYlpVv3r3BlRQjkQdSvhjVjTi2reSnQ5FNDzoLvXFfzNeWJg9aXVn/0RhXhk7rPZ39go8YadfQdFMftIlLJkN8e/FmCeBhV16NJhsEg9pVDrwoXEeVXvYN3Uh0HxfzqYdJzLjHDfq8jeymh0cBp9DsKW75hl5P4e0sWmGjQLru9ieVCzcvbtyPELg1nCOPmFTBcQ5D2tgtyfXE0ukB7ZOAkN5NbHZUpdgIE4NrTh8+LxKqnfWQZl3Rhc/xMRtdvHfZrTdrL9kzp93Cy6FVyrhQxafnayf1ombbrhzusGZyeOPR09kcleVsloc6n4V9FPxBQtctY0Y4w1GFLuT7AQTRwK3RFb3rfLC9qBAcXtL7igdHbWCQmV48o/YMM20IazDDe7JQc7TBMmHaY0KdCBCd3Ry24bVs1PsO90/jiG7dpcDAQ3h9YawWO37qjedc8KqIFmVOBe9Cn9iQMsTtUtlfwVr8S/xDEurJrHU0NSobq2FMftuGKCyLtmp7ti9DcUWgWFcB1VJ1xzbQpReOD6Jc7WgLp5ToWLc7Ieo2+I3QYveSXAETfOh27Lig+aIGU1r2JT0fHgBG4fP2yvV9jJdhIhAU4pj9XFmDcgSLqnZSI3bDK+rv9CKuPlkhghFLBKJEsyRpKw092elEH0bhalbhtOoIWhemR/8xPRdJIz9BcWTU0xY6hsHfn05PNFT79aKl8F2EF5xUsAXiNvi5NScyJT+shnE+QMTiB+UblCOPDTa5Mu7gAUF5+tHiTUgbVfRd3bA+o2tAk03G08ePy8ouHEvwtEVQUwz/MJhUh/LbscVetGd/8D2uK1bXAsrUAMn9DWSZ1jX4Yy81DZZKVMo5Xyi6jb/cVr86UV/0bQ=="};
let PW=null; const u8=a=>Uint8Array.from(atob(a),c=>c.charCodeAt(0));
async function unlock(p){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SEC.s),iterations:300000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(SEC.i)},k,u8(SEC.c))));}
async function getPW(ask){ if(PW) return PW; let p=localStorage.getItem('rooms6pw');
  if(!p&&ask) p=prompt('비번 보기 암호'); if(!p) return null;
  try{PW=await unlock(p.trim()); localStorage.setItem('rooms6pw',p.trim()); return PW;}catch(e){localStorage.removeItem('rooms6pw'); if(ask) alert('암호가 틀려요'); return null;}}
function secBox(i,box){const show=P=>{box.innerHTML=P[i].map(r=>'<div>'+esc(r[0])+': <b>'+esc(r[1])+'</b></div>').join('');};
  getPW(false).then(P=>{ if(P) return show(P);
    box.innerHTML='<button class="lk">🔒 비번 보기</button>';
    box.querySelector('.lk').onclick=ev=>{ev.stopPropagation(); getPW(true).then(P=>P&&show(P));}; });}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const naver=a=>'https://map.naver.com/p/search/'+encodeURIComponent('부산 '+a);

kakao.maps.load(()=>{
  const map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(35.1685,129.1115),level:4});
  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);

  const pop=new kakao.maps.CustomOverlay({xAnchor:0,yAnchor:0,zIndex:100,clickable:true});
  let cur=null;
  const close=()=>{pop.setMap(null); if(cur) cur.classList.remove('on'); cur=null;};
  const bounds=new kakao.maps.LatLngBounds(); const marks=[];

  L.forEach((x,i)=>{
    const pos=new kakao.maps.LatLng(x.lat,x.lng); bounds.extend(pos);
    const d=document.createElement('div'); d.className='num'; d.textContent=i+1;
    marks.push({d,pos});
    d.addEventListener('click',e=>{
      e.stopPropagation(); close(); cur=d; d.classList.add('on');
      const w=document.createElement('div'); w.className='pop';
      w.innerHTML='<button class="x" aria-label="닫기">×</button>'+
        '<div class="t">'+(i+1)+'. '+esc(x.t)+'</div>'+
        '<div>'+esc(x.a)+'</div>'+
        '<div class="p">'+esc(x.p)+'</div>'+
        '<div style="color:#555;font-size:13px">'+esc(x.s)+'</div>'+
        '<div class="sec"></div>'+
        '<a class="ph nv" href="'+naver(x.a)+'" target="_blank" rel="noopener">네이버지도 열기</a>';
      secBox(i,w.querySelector('.sec'));
      w.querySelector('.x').onclick=ev=>{ev.stopPropagation(); close();};
      ['mousedown','touchstart','click'].forEach(t=>w.addEventListener(t,ev=>ev.stopPropagation()));
      pop.setContent(w); pop.setPosition(pos); pop.setMap(map);
      if(w.parentElement) w.parentElement.style.pointerEvents='none';
      map.panTo(pos);
    });
    new kakao.maps.CustomOverlay({map,position:pos,content:d,xAnchor:0.5,yAnchor:0.5,zIndex:60,clickable:true});
  });
  kakao.maps.event.addListener(map,'click',close);
  // 붙어 있는 번호 겹침 방지: 확대 단계마다 화면에서만 벌림(좌표는 그대로)
  const spread=()=>{
    const pr=map.getProjection(), P=marks.map(m=>{const c=pr.containerPointFromCoords(m.pos);return {x:c.x,y:c.y,ox:0,oy:0};});
    for(let k=0;k<20;k++) for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){
      const a=P[i],b=P[j]; let dx=(b.x+b.ox)-(a.x+a.ox), dy=(b.y+b.oy)-(a.y+a.oy), dd=Math.hypot(dx,dy);
      if(dd>=32) continue; if(dd<0.01){dx=1;dy=0;dd=1;}
      const push=(32-dd)/2; a.ox-=dx/dd*push; a.oy-=dy/dd*push; b.ox+=dx/dd*push; b.oy+=dy/dd*push; }
    marks.forEach((m,i)=>m.d.style.transform='translate('+P[i].ox.toFixed(1)+'px,'+P[i].oy.toFixed(1)+'px)');
  };
  kakao.maps.event.addListener(map,'zoom_changed',()=>setTimeout(spread,0));
  map.setBounds(bounds,60,40,40,40); setTimeout(spread,0);
});
