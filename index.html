const L=[{"t": "제이엠스카이 301호", "a": "수영구 광안동 90-59", "p": "2,000/72", "s": "공실(즉시입주) · 인터넷·TV·수도 별도", "ph": "https://drive.google.com/drive/folders/1U7089YiksMsWUQp4aJLeYa1mQmVVp3YT", "lat": 35.1650163255628, "lng": 129.116628938876}, {"t": "힐링휴 302호", "a": "수영구 광안동 662-19", "p": "2,000/70", "s": "세입자 있음 · 협의입주", "ph": "https://drive.google.com/drive/folders/14xIQAuAO3_WsBOBiTAFZlIx40xkti8Ti", "lat": 35.1631016552495, "lng": 129.113176833554}, {"t": "월드빌 302호", "a": "연제구 연산동 1128-3", "p": "1,000/65", "s": "공실(즉시입주) · 수도 별도", "ph": "https://drive.google.com/drive/folders/12DOXOxdPUgEWIN-NgSPvszpuEH39XcFu", "lat": 35.1829672588962, "lng": 129.084743739994}, {"t": "에르모 507호", "a": "연제구 연산동 1255-2", "p": "2,800/54", "s": "12/7 이사 예정(세입자 있음) · 관리비 10만, 인터넷·TV·수도 별도", "ph": "https://drive.google.com/drive/folders/1H7lR4yqRfSiGh63s_bu2hgifzbYzEeqj", "lat": 35.1859928005865, "lng": 129.078952750331}, {"t": "연제하이츠 507호", "a": "연제구 연산동 1386-27", "p": "1,000/60", "s": "공실(즉시입주)", "ph": "", "lat": 35.1838792437502, "lng": 129.077644946677}, {"t": "해강아크로빌 602호", "a": "부산진구 양정동 213-5", "p": "2,000/65", "s": "세입자 있음(만료 전) · 협의입주 · 인터넷 별도", "ph": "https://drive.google.com/drive/folders/1wH6WAPSnJUjQTKmABbgy4CoUbJKv4oJp", "lat": 35.1769154421354, "lng": 129.073478053486}, {"t": "해강쉐르빌 705호", "a": "부산진구 양정동 213-1", "p": "1,000/60", "s": "공실(즉시입주)", "ph": "https://drive.google.com/drive/folders/19F2Zvz5hAMlqI6hT_nKZICTl_dzrDKb4", "lat": 35.1768730368476, "lng": 129.073275794217}, {"t": "드림하우스 303호", "a": "연제구 연산동 1306-21", "p": "1,000/65", "s": "세입자 있음 · 협의입주", "ph": "", "lat": 35.1807592618729, "lng": 129.079293257635}, {"t": "이오니아C 402호", "a": "연제구 연산동 719-16", "p": "1,000/60", "s": "세입자 있음 · 협의입주", "ph": "", "lat": 35.1810001096498, "lng": 129.082781451545}];
const SEC={"s": "v/LA9N7reIzom5nvgT5R0Q==", "i": "CrYdY1fnvPazh7wQ", "c": "4JpFnLnxSGY/kKbV31MnDkzUO9qtmYmB//DX57nJWByQt/rZ+XIYLRUogpZTQUDRdL+JIjt6XhDHkCsByb6BbIM0I6IxmnrnUhmfNdULtuw/2hVr2OfMXyVH3aFBkx98GwS6cS2ZFAR5BS6ee2FNorQKEgKdvVj9gHbf8wdpoc/jyj0RKfjksrS39sdx9iNRKB4jQz89etKrc+Osnoj4ChRkctH59uETeI7VtKqTHYJNFfT59JlXXnelcX4jnGB18jetM8SiV+ZeGUbW3pKsUpCkxAGyBqGfDlyL9dIzB6ZGhXWHOjEUcZQLXqMs0DlP0vwJ49HTw4js1+icOns7KKD5LMI6vPWighIRAWqnuxaDW86smNxX5nGxdFYeEX9oSFIphFtynkbzEg2hN14I0NeXV87+zTOGXv2ym0lHXvL2gwot2BKckIq80aDtPt/GSE32vYpj5WzhIgucLbDpUaM2mqbQ2XZX1Qo27k8nJnvCbf6TwroCbQaWeUFWpb98RCjyPrVB/mKWqSy1nM6TBUwTac77ri3UIcsKwFHVypvrO2QPgw9/Mc3sFyROAGmSzgr4YZK0ZIHAafk6EXPaWXhGIOH7LuarXnB9uK1Bpf5WDwJeP2hyQBX2riiigrzBIrY7rMrTx6RKegSxovpXSFzKBTOda/qihQvN66vtAhe2Pr/uvlHpvKQ0VqnXdoVIAdr063UKa0/l25YTFC/W5Tke4XmsrKZefJTrbfgIKbD0A3WIkcx3OEvSN7oJKpnA3FoxkbaxDiDcvoLF9daKMJHl/thUO8nxEZvc03CXzdazGfsWzPd1UXiMKZQkjLw7towjV2dHFQ85+hAtMyogosDp01XVyqBHHrWvhYwhM4yW/wRAHF3IMPJAuZRuJHAvbD3EKL+mYPUtw33GokzHDTfx+qqrkZArpVhfH95W1wotTXGJx6izAV4iKiH24g/bVXRmIDl4cD+sI8ubKo1u6SkPv22H6MQUntsFMaoC2fHVLNGFTHx0ttygB8jgQdvnOsT2qpAn+dXF4GsEWbSncfII294bGNcIZrlSWHB83kBf75onXtKv7+6KKN0fstX6vkFPvi+rXs3r9KbxQMhUCfVHiZhcgrEHybDSUn1krGVshm92pQ9Z4jP5b2aRNuanpXL8yDICN/WluHRqGKU9T8uBZ8QyD57x0YI4Yy/TwAPDcd4XiS7uc3QZiJ2B5w67R1lfQV1XoFo8FsLTPZQoFyFAWEQypd2TBzDz+YBtATK8xR4X+gdGrhTd/2BUetXQJXvWazLn2uxf2YmB9tRm4d9SsI/OmqHJXE+KB6J66Od9Sm6M5qRUMw7AIYnYl6E725emCLEd7WkSZYuPKWR2kuCvS2GSqBi0wG/tuC/X5eRAZn+TaT/0MAvibEOFwSIDVG6sXfUKb09D5JyoGP7fswG2AX6+3jrcqH7VnqUcOg=="};
let PW=null; const u8=a=>Uint8Array.from(atob(a),c=>c.charCodeAt(0));
async function unlock(p){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SEC.s),iterations:300000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(SEC.i)},k,u8(SEC.c))));}
async function getPW(ask){ if(PW) return PW; let p=localStorage.getItem('rooms6pw');
  if(!p&&ask) p=prompt('비번 보기 암호'); if(!p) return null;
  try{PW=await unlock(p.trim()); localStorage.setItem('rooms6pw',p.trim()); return PW;}catch(e){localStorage.removeItem('rooms6pw'); if(ask) alert('암호가 틀려요'); return null;}}
function secBox(i,box){const show=P=>{box.innerHTML=P[i].map(r=>'<div>'+esc(r[0])+': <b>'+esc(r[1])+'</b></div>').join('');};
  getPW(false).then(P=>{ if(P) return show(P);
    box.innerHTML='<button class="lk">🔒 비번 보기</button>';
    box.querySelector('.lk').onclick=ev=>{ev.stopPropagation(); getPW(true).then(P=>P&&show(P));}; });}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const naver=a=>'https://map.naver.com/p/search/'+encodeURIComponent('부산 '+a);

kakao.maps.load(()=>{
  const map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(35.1685,129.1115),level:4});
  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);

  const pop=new kakao.maps.CustomOverlay({xAnchor:0,yAnchor:0,zIndex:100,clickable:true});
  let cur=null;
  const close=()=>{pop.setMap(null); if(cur) cur.classList.remove('on'); cur=null;};
  const bounds=new kakao.maps.LatLngBounds(); const marks=[];

  L.forEach((x,i)=>{
    const pos=new kakao.maps.LatLng(x.lat,x.lng); bounds.extend(pos);
    const d=document.createElement('div'); d.className='num'; d.textContent=i+1;
    marks.push({d,pos});
    d.addEventListener('click',e=>{
      e.stopPropagation(); close(); cur=d; d.classList.add('on');
      const w=document.createElement('div'); w.className='pop';
      w.innerHTML='<button class="x" aria-label="닫기">×</button>'+
        '<div class="t">'+(i+1)+'. '+esc(x.t)+'</div>'+
        '<div>'+esc(x.a)+'</div>'+
        '<div class="p">'+esc(x.p)+'</div>'+
        '<div style="color:#555;font-size:13px">'+esc(x.s)+'</div>'+
        '<div class="sec"></div>'+
        '<a class="ph nv" href="'+naver(x.a)+'" target="_blank" rel="noopener">네이버지도 열기</a>'+
        (x.ph?'<a class="ph" href="'+esc(x.ph)+'" target="_blank" rel="noopener">📷 사진 보러가기</a>':'<span class="ph no">사진 없음</span>');
      secBox(i,w.querySelector('.sec'));
      w.querySelector('.x').onclick=ev=>{ev.stopPropagation(); close();};
      ['mousedown','touchstart','click'].forEach(t=>w.addEventListener(t,ev=>ev.stopPropagation()));
      pop.setContent(w); pop.setPosition(pos); pop.setMap(map);
      if(w.parentElement) w.parentElement.style.pointerEvents='none';
      map.panTo(pos);
    });
    new kakao.maps.CustomOverlay({map,position:pos,content:d,xAnchor:0.5,yAnchor:0.5,zIndex:60,clickable:true});
  });
  kakao.maps.event.addListener(map,'click',close);
  // 붙어 있는 번호 겹침 방지: 확대 단계마다 화면에서만 벌림(좌표는 그대로)
  const spread=()=>{
    const pr=map.getProjection(), P=marks.map(m=>{const c=pr.containerPointFromCoords(m.pos);return {x:c.x,y:c.y,ox:0,oy:0};});
    for(let k=0;k<20;k++) for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){
      const a=P[i],b=P[j]; let dx=(b.x+b.ox)-(a.x+a.ox), dy=(b.y+b.oy)-(a.y+a.oy), dd=Math.hypot(dx,dy);
      if(dd>=32) continue; if(dd<0.01){dx=1;dy=0;dd=1;}
      const push=(32-dd)/2; a.ox-=dx/dd*push; a.oy-=dy/dd*push; b.ox+=dx/dd*push; b.oy+=dy/dd*push; }
    marks.forEach((m,i)=>m.d.style.transform='translate('+P[i].ox.toFixed(1)+'px,'+P[i].oy.toFixed(1)+'px)');
  };
  kakao.maps.event.addListener(map,'zoom_changed',()=>setTimeout(spread,0));
  map.setBounds(bounds,60,40,40,40); setTimeout(spread,0);
});
